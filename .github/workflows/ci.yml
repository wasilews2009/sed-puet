name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Тести модулів (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [db-schema, ingest-pipeline, rag-compliance, approval-routing, sed-app]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sed_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SED_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sed_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            modules/*/requirements.txt
      - name: Tesseract (ukr+eng)
        if: matrix.module == 'ingest-pipeline' || matrix.module == 'rag-compliance' || matrix.module == 'sed-app'
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-ukr tesseract-ocr-eng
      - name: Залежності
        working-directory: modules/sed-app
        # sed-app підтягує requirements усіх модулів; pypdf потрібен лише тестам ingest-pipeline
        run: pip install -c ../../constraints.txt -r requirements.txt pytest pypdf
      - name: pytest
        working-directory: modules/${{ matrix.module }}
        env:
          PYTHONPATH: .:../db-schema:../ingest-pipeline:../rag-compliance:../approval-routing
        run: pytest -q

  frontend:
    name: Інтерфейс (тести, типи, збірка)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: modules/sed-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/sed-frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Залежності модуля маршрутів (перевірка КЕП-підпису сервером)
        working-directory: modules/approval-routing
        run: pip install -c ../../constraints.txt -r requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  docker:
    name: Збірка Docker-образів
    runs-on: ubuntu-24.04
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: cp .env.example .env && docker compose config -q
      - name: Образ API
        run: docker build -f docker/app.Dockerfile -t puet/sed-app:ci .
      - name: Образ веб-інтерфейсу
        run: docker build -f docker/web.Dockerfile -t puet/sed-web:ci .
