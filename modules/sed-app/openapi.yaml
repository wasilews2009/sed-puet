openapi: 3.1.0
info:
  title: СЕД ПУЕТ — система електронного документообігу з ШІ
  description: 'Єдиний API СЕД Полтавського університету економіки і торгівлі: реєстрація документів з OCR і вилученням реквізитів
    за ДСТУ 4163:2020, нормативний аудит проєктів (RAG), маршрути погодження з КЕП, ручна валідація результатів ШІ (confidence
    < 0.85). ШІ є асистентом: юридичної сили документ набуває лише після накладання КЕП посадовою особою.'
  version: 0.1.0
paths:
  /api/v1/auth/config:
    get:
      tags:
      - Автентифікація
      summary: 'Як входити: Keycloak (OIDC + PKCE) чи dev-стенд'
      operationId: auth_config_api_v1_auth_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfigOut'
  /api/v1/auth/dev-users:
    get:
      tags:
      - Автентифікація
      summary: Демо-користувачі (лише dev-стенд)
      operationId: dev_users_api_v1_auth_dev_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DevUserOut'
                type: array
                title: Response Dev Users Api V1 Auth Dev Users Get
  /api/v1/auth/dev-login:
    post:
      tags:
      - Автентифікація
      summary: Увійти демо-користувачем (лише dev-стенд)
      operationId: dev_login_api_v1_auth_dev_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me:
    get:
      tags:
      - Автентифікація
      summary: Поточний користувач, його ролі та права
      operationId: me_api_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
      security:
      - HTTPBearer: []
  /api/v1/dictionaries:
    get:
      tags:
      - Довідники
      summary: Підрозділи, види документів, підписи статусів українською
      operationId: dictionaries_api_v1_dictionaries_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionariesOut'
      security:
      - HTTPBearer: []
  /api/v1/documents:
    get:
      tags:
      - Документи
      summary: Документи, доступні користувачу
      operationId: list_documents_api_v1_documents_get
      security:
      - HTTPBearer: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          description: Пошук у заголовку, індексі, короткому змісті
          title: Q
        description: Пошук у заголовку, індексі, короткому змісті
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/DocumentStatus'
          - type: 'null'
          title: Status
      - name: type_code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Type Code
      - name: org_unit_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Org Unit Id
      - name: needs_review
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Лише ті, що чекають ручної валідації ШІ
          title: Needs Review
        description: Лише ті, що чекають ручної валідації ШІ
      - name: mine
        in: query
        required: false
        schema:
          type: boolean
          description: Лише мої (я автор)
          default: false
          title: Mine
        description: Лише мої (я автор)
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DocumentSort'
          default: -updated_at
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 100000
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        '401':
          description: Немає або недійсний токен
        '403':
          description: Немає права на дію
        '404':
          description: Документ не знайдено або немає доступу
        '409':
          description: Картку змінив інший користувач
        '422':
          description: Некоректні дані
  /api/v1/documents/{document_id}:
    get:
      tags:
      - Документи
      summary: 'Картка документа: реквізити ШІ, комплаєнс, маршрут, підписи, історія'
      operationId: get_card_api_v1_documents__document_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCard'
        '401':
          description: Немає або недійсний токен
        '403':
          description: Немає права на дію
        '404':
          description: Документ не знайдено або немає доступу
        '409':
          description: Картку змінив інший користувач
        '422':
          description: Некоректні дані
  /api/v1/documents/{document_id}/versions/{version_id}/file:
    get:
      tags:
      - Документи
      summary: Оригінал файлу версії (з перевіркою доступу і записом у журнал)
      operationId: download_api_v1_documents__document_id__versions__version_id__file_get
      security:
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      - name: version_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Version Id
      - name: inline
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Inline
      responses:
        '200':
          description: Successful Response
        '401':
          description: Немає або недійсний токен
        '403':
          description: Немає права на дію
        '404':
          description: Документ не знайдено або немає доступу
        '409':
          description: Картку змінив інший користувач
        '422':
          description: Некоректні дані
  /api/v1/documents/{document_id}/fields/{field_id}/review:
    post:
      tags:
      - Ручна валідація
      summary: Підтвердити, виправити або відхилити реквізит, вилучений ШІ
      description: 'Обов''язково для реквізитів з впевненістю < 0.85. Підтверджене значення потрапляє

        в `documents.requisites` (картку); сирий вихід моделі лишається в `ai_extracted_fields`.'
      operationId: review_field_api_v1_documents__document_id__fields__field_id__review_post
      security:
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      - name: field_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Field Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldReviewIn'
      responses:
        '204':
          description: Successful Response
        '401':
          description: Немає або недійсний токен
        '403':
          description: Немає права на дію
        '404':
          description: Документ не знайдено або немає доступу
        '409':
          description: Картку змінив інший користувач
        '422':
          description: Некоректні дані
  /api/v1/documents/{document_id}/requisites/accept-confident:
    post:
      tags:
      - Ручна валідація
      summary: Перенести в картку реквізити, вилучені ШІ з впевненістю ≥ 0.85
      description: Значення з високою впевненістю не потребують перевірки, але в картку їх переносить людина.
      operationId: accept_confident_api_v1_documents__document_id__requisites_accept_confident_post
      security:
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptConfidentIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptConfidentOut'
        '401':
          description: Немає або недійсний токен
        '403':
          description: Немає права на дію
        '404':
          description: Документ не знайдено або немає доступу
        '409':
          description: Картку змінив інший користувач
        '422':
          description: Некоректні дані
  /api/v1/documents/{document_id}/requisites:
    put:
      tags:
      - Ручна валідація
      summary: Ввести реквізити вручну (ШІ не впорався або модель недоступна)
      operationId: enter_requisites_api_v1_documents__document_id__requisites_put
      security:
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisitesIn'
      responses:
        '204':
          description: Successful Response
        '401':
          description: Немає або недійсний токен
        '403':
          description: Немає права на дію
        '404':
          description: Документ не знайдено або немає доступу
        '409':
          description: Картку змінив інший користувач
        '422':
          description: Некоректні дані
  /api/v1/documents/{document_id}/findings/{finding_id}/resolution:
    post:
      tags:
      - Ручна валідація
      summary: Розглянути зауваження комплаєнсу
      operationId: resolve_finding_api_v1_documents__document_id__findings__finding_id__resolution_post
      security:
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      - name: finding_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Finding Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingResolutionIn'
      responses:
        '204':
          description: Successful Response
        '401':
          description: Немає або недійсний токен
        '403':
          description: Немає права на дію
        '404':
          description: Документ не знайдено або немає доступу
        '409':
          description: Картку змінив інший користувач
        '422':
          description: Некоректні дані
  /api/v1/documents/{document_id}/ai-runs/{run_id}/review:
    post:
      tags:
      - Ручна валідація
      summary: Підтвердити або відхилити результат ШІ в цілому (напр. звіт комплаєнсу)
      operationId: review_run_api_v1_documents__document_id__ai_runs__run_id__review_post
      security:
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunReviewIn'
      responses:
        '204':
          description: Successful Response
        '401':
          description: Немає або недійсний токен
        '403':
          description: Немає права на дію
        '404':
          description: Документ не знайдено або немає доступу
        '409':
          description: Картку змінив інший користувач
        '422':
          description: Некоректні дані
  /api/v1/documents/{document_id}/compliance-checks:
    post:
      tags:
      - Нормативний аудит
      summary: Перевірити поточну версію на відповідність Статуту, положенням ПУЕТ і наказам МОН
      description: 'Синхронний виклик графа LangGraph модуля `sed_rag` (хвилини на великих документах).

        Результат пишеться в `ai_runs` + `compliance_*`; картка показує його з цитатами і статусами зауважень.'
      operationId: run_compliance_api_v1_documents__document_id__compliance_checks_post
      security:
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ComplianceRunIn'
              - type: 'null'
              title: Body
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Run Compliance Api V1 Documents  Document Id  Compliance Checks Post
        '401':
          description: Немає або недійсний токен
        '403':
          description: Немає права на дію
        '404':
          description: Документ не знайдено або немає доступу
        '409':
          description: Картку змінив інший користувач
        '422':
          description: Некоректні дані
        '503':
          description: Qdrant / LLM недоступні
  /api/v1/review-queue:
    get:
      tags:
      - Ручна валідація
      summary: Результати ШІ з впевненістю < 0.85, які чекають мого рішення
      operationId: review_queue_api_v1_review_queue_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ReviewQueueItem'
                type: array
                title: Response Review Queue Api V1 Review Queue Get
      security:
      - HTTPBearer: []
  /api/v1/approvals/inbox:
    get:
      tags:
      - Погодження
      summary: Мої активні кроки погодження (візи, підписи)
      operationId: inbox_api_v1_approvals_inbox_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/sed_app__api__schemas__InboxItem'
                type: array
                title: Response Inbox Api V1 Approvals Inbox Get
      security:
      - HTTPBearer: []
  /api/v1/documents/ingest:
    post:
      tags:
      - Інжест документів
      summary: Завантажити вхідний документ і вилучити реквізити (ДСТУ 4163:2020)
      description: Зберігає оригінал у MinIO, розпізнає текст (текстовий шар PDF або Tesseract ukr+eng), вилучає реквізити
        локальною LLM зі structured output і повертає їх із confidence score. Створюється картка документа в статусі «чернетка».
        Реквізити з впевненістю < 0.85 потрапляють у чергу ручної валідації; юридичної сили документ ШІ не надає.
      operationId: ingest_document_api_v1_documents_ingest_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_ingest_document_api_v1_documents_ingest_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Немає права реєструвати документи підрозділу
        '415':
          description: Формат файлу не підтримується (перевіряється за вмістом)
        '422':
          description: Файл пошкоджено, захищено паролем, завеликий або невалідні поля форми
        '503':
          description: Сховище файлів недоступне
      security:
      - HTTPBearer: []
  /api/v1/compliance/check:
    post:
      tags:
      - Нормативний аудит
      summary: Перевірити текст проєкту (без збереження)
      description: 'Шукає релевантні пункти Статуту, положень ПУЕТ, законів і наказів МОН, оцінює кожен пункт

        проєкту і повертає звіт з переліком пунктів актів, які можуть бути порушені. Підходить для

        перевірки чернетки в редакторі чи проєкту, згенерованого асистентом; у БД нічого не пише.'
      operationId: check_text_api_v1_compliance_check_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckTextRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReport'
        '401':
          description: Немає або недійсний токен
        '403':
          description: Немає доступу
        '422':
          description: Некоректний запит
        '503':
          description: Векторна БД, сервер ембедингів або БД недоступні
      security:
      - HTTPBearer: []
  /api/v1/regulations/search:
    get:
      tags:
      - Нормативний корпус
      summary: Гібридний пошук пунктів актів
      operationId: search_api_v1_regulations_search_get
      security:
      - HTTPBearer: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 2000
          title: Q
      - name: as_of
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: As Of
      - name: k
        in: query
        required: false
        schema:
          type: integer
          maximum: 30
          minimum: 1
          default: 10
          title: K
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '401':
          description: Немає або недійсний токен
        '403':
          description: Немає доступу
        '422':
          description: Некоректний запит
        '503':
          description: Векторна БД, сервер ембедингів або БД недоступні
  /api/v1/regulations:
    post:
      tags:
      - Нормативний корпус
      summary: Додати або переіндексувати акт
      description: 'Сегментує текст на пункти, рахує ембединги і BM25, пише ревізію в `regulatory_*` і Qdrant.

        Повторне надсилання того самого тексту нічого не змінює; змінений текст створює нову ревізію

        (старі фрагменти лишаються для історичних цитат).'
      operationId: ingest_act_api_v1_regulations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestActRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestActResponse'
        '401':
          description: Немає або недійсний токен
        '403':
          description: Немає доступу
        '422':
          description: Некоректний запит
        '503':
          description: Векторна БД, сервер ембедингів або БД недоступні
      security:
      - HTTPBearer: []
  /api/v1/regulations/{source_id}/status:
    put:
      tags:
      - Нормативний корпус
      summary: Змінити статус / строки чинності акта
      description: 'Напр. акт скасовано: нові перевірки перестають його цитувати як чинний, а посилання на нього

        в проєктах стають зауваженням «посилання на нечинний акт».'
