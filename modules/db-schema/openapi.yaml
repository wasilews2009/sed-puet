openapi: 3.1.0
info:
  title: СЕД ПУЕТ — внутрішній контракт AI-воркер ↔ Core API
  version: 0.1.0
  description: |
    Міжсервісний контракт, через який AI-пайплайни (Celery/Arq) записують результати
    у таблиці `ai_runs`, `ai_extracted_fields`, `compliance_checks/findings/citations`.
    Автентифікація: OAuth2 client credentials (Keycloak, клієнт `sed-ai-worker`).
    AI-воркер НЕ має ендпоінтів для зміни статусу документа, рішень у маршруті чи КЕП.
servers:
  - url: https://sed.puet.local/internal/v1
security:
  - keycloak: [ai:write]

paths:
  /ai-runs:
    post:
      summary: Зареєструвати запуск AI-задачі (стан queued/running)
      operationId: createAiRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiRunCreate' }
      responses:
        '201':
          description: Створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiRun' }
        '422': { $ref: '#/components/responses/Invalid' }

  /ai-runs/{runId}/result:
    put:
      summary: Завершити запуск разом з реквізитами та комплаєнс-перевіркою (атомарно)
      description: |
        В одній транзакції записує `ai_runs`, `ai_extracted_fields`, `compliance_checks/findings/citations`.
        Сервер встановлює `human_review_status = pending`, якщо confidence запуску чи будь-якого
        реквізиту < 0.85. На COMMIT тригер пише підсумок у `audit_logs` (category = ai_analysis):
        confidence_score, violations, extracted_metadata (ПД замасковано).
        Повторний виклик з тим самим `Idempotency-Key` повертає збережений результат.
        Схема тіла відповідає Pydantic-моделі `sed_db.schemas.AiRunResult`.
      operationId: completeAiRun
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiRunResult' }
      responses:
        '200':
          description: Збережено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiRun' }
        '409': { description: Запуск уже завершено з іншим результатом }
        '422': { $ref: '#/components/responses/Invalid' }


components:
  securitySchemes:
    keycloak:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://sso.puet.local/realms/puet/protocol/openid-connect/token
          scopes: { 'ai:write': Запис результатів AI-пайплайнів }

  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 128 }

  responses:
    Invalid:
      description: Порушено інваріант (наприклад, LLM-задача без маскування PII)
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: { type: string }
              title: { type: string }
              detail: { type: string }
              constraint: { type: string, examples: [ck_ai_runs_llm_input_pii_masked] }

  schemas:
    Confidence:
      type: number
      minimum: 0
      maximum: 1
      multipleOf: 0.0001

    AiTaskType:
      type: string
      enum: [ocr, classification, ner_extraction, compliance_check, route_suggestion,
             anomaly_detection, document_generation, pii_masking]

    AiRunCreate:
      type: object
      required: [task_type, model_id, document_version_id, pii_masked]
      properties:
        task_type: { $ref: '#/components/schemas/AiTaskType' }
        model_id: { type: string, format: uuid }
        prompt_template_id: { type: [string, 'null'], format: uuid }
        document_version_id: { type: string, format: uuid }
        worker_task_id: { type: string, maxLength: 128 }
        pii_masked: { type: boolean, description: 'Обов''язково true для LLM-задач' }
        parameters: { type: object, additionalProperties: true }

    AiRunResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [succeeded, failed, cancelled] }
        confidence: { $ref: '#/components/schemas/Confidence' }
        pii_entities_masked: { type: integer, minimum: 0 }
        input_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        output: { type: object, additionalProperties: true }
        extracted_fields:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ExtractedField' }
        compliance_check: { $ref: '#/components/schemas/ComplianceCheckCreate' }
        tokens_in: { type: integer, minimum: 0 }
        tokens_out: { type: integer, minimum: 0 }
        latency_ms: { type: integer, minimum: 0 }
        error_message: { type: string }

    AiRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        confidence: { $ref: '#/components/schemas/Confidence' }
        requires_human_review: { type: boolean }
        human_review_status:
          type: string
          enum: [not_required, pending, confirmed, corrected, rejected]

    ExtractedField:
      type: object
      required: [field_key, confidence]
      properties:
        field_key: { type: string, examples: [order_number, signer_full_name, amount_uah, order_date] }
        extracted_value: {}
        confidence: { $ref: '#/components/schemas/Confidence' }
        page_no: { type: integer, minimum: 1 }
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4

    ComplianceCheckCreate:
      type: object
      required: [verdict, regulations_as_of, findings]
      properties:
        verdict: { type: string, enum: [compliant, issues_found, non_compliant, inconclusive] }
        summary: { type: string }
        regulations_as_of: { type: string, format: date }
        retrieval_config:
          type: object
          examples: [ { dense_k: 20, bm25_k: 20, fusion: rrf, rrf_k: 60, reranker: bge-reranker-v2-m3 } ]
        sources_considered: { type: integer, minimum: 0 }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }

    Finding:
      type: object
      required: [severity, category, title, explanation, confidence, citations]
      properties:
        severity: { type: string, enum: [info, minor, major, critical] }
        category:
          type: string
          enum: [contradiction, outdated_reference, missing_requisite, dstu_formatting,
                 competence_violation, deadline_violation, personal_data, other]
        title: { type: string, maxLength: 512 }
        explanation: { type: string }
        recommendation: { type: string }
        fragment_text: { type: string }
        page_no: { type: integer, minimum: 1 }
        char_start: { type: integer, minimum: 0 }
        char_end: { type: integer, minimum: 1 }
        confidence: { $ref: '#/components/schemas/Confidence' }
        citations:
          type: array
          minItems: 1
          description: Зауваження без першоджерела не приймається
          items: { $ref: '#/components/schemas/Citation' }

    Citation:
      type: object
      required: [chunk_id, quoted_text, quote_verified]
      description: Хоча б одна цитата зауваження має quote_verified = true
      properties:
        chunk_id: { type: string, format: uuid }
        quoted_text: { type: string, minLength: 1 }
        quote_verified:
          type: boolean
          description: Пайплайн перевірив, що цитата буквально міститься у фрагменті
        dense_score: { type: number }
        sparse_score: { type: number }
        fused_score: { type: number }
        rerank_score: { type: number }
