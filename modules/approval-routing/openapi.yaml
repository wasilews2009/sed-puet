openapi: 3.1.0
info:
  title: СЕД ПУЕТ — маршрути погодження
  description: Визначення учасників погодження за шаблоном, послідовне візування з КЕП; ключі підпису (КЕП Дії, ПриватБанку,
    інших КНЕДП) і внутрішні ключі АІ-СЕД ПУЕТ.
  version: 0.1.0
paths:
  /api/v1/documents/{document_id}/route-preview:
    post:
      tags:
      - Маршрути погодження
      summary: Визначити посадових осіб, які мають завізувати документ (без збереження)
      operationId: preview_api_v1_documents__document_id__route_preview_post
      security:
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePlanView'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Немає права на цю дію (не автор/ініціатор/учасник кроку, сервісний акаунт ШІ)
        '404':
          description: Документ, маршрут або крок не знайдено
        '409':
          description: 'Неприпустимо в поточному стані: етап ще не настав, рішення вже прийнято, посада вакантна, немає/кілька
            шаблонів, відкриті критичні зауваження'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/documents/{document_id}/routes:
    post:
      tags:
      - Маршрути погодження
      summary: Створити маршрут погодження за шаблоном і (за замовчуванням) запустити його
      operationId: create_route_api_v1_documents__document_id__routes_post
      security:
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteView'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Немає права на цю дію (не автор/ініціатор/учасник кроку, сервісний акаунт ШІ)
        '404':
          description: Документ, маршрут або крок не знайдено
        '409':
          description: 'Неприпустимо в поточному стані: етап ще не настав, рішення вже прийнято, посада вакантна, немає/кілька
            шаблонів, відкриті критичні зауваження'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/documents/{document_id}/route:
    get:
      tags:
      - Маршрути погодження
      summary: Останній маршрут документа
      operationId: document_route_api_v1_documents__document_id__route_get
      security:
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteView'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Немає права на цю дію (не автор/ініціатор/учасник кроку, сервісний акаунт ШІ)
        '404':
          description: Документ, маршрут або крок не знайдено
        '409':
          description: 'Неприпустимо в поточному стані: етап ще не настав, рішення вже прийнято, посада вакантна, немає/кілька
            шаблонів, відкриті критичні зауваження'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/routes/{route_id}:
    get:
      tags:
      - Маршрути погодження
      summary: Стан маршруту
      operationId: get_route_api_v1_routes__route_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Route Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteView'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Немає права на цю дію (не автор/ініціатор/учасник кроку, сервісний акаунт ШІ)
        '404':
          description: Документ, маршрут або крок не знайдено
        '409':
          description: 'Неприпустимо в поточному стані: етап ще не настав, рішення вже прийнято, посада вакантна, немає/кілька
            шаблонів, відкриті критичні зауваження'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/routes/{route_id}/start:
    post:
      tags:
      - Маршрути погодження
      summary: Запустити створений маршрут
      operationId: start_route_api_v1_routes__route_id__start_post
      security:
      - HTTPBearer: []
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Route Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteStart'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteView'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Немає права на цю дію (не автор/ініціатор/учасник кроку, сервісний акаунт ШІ)
        '404':
          description: Документ, маршрут або крок не знайдено
        '409':
          description: 'Неприпустимо в поточному стані: етап ще не настав, рішення вже прийнято, посада вакантна, немає/кілька
            шаблонів, відкриті критичні зауваження'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/routes/{route_id}/cancel:
    post:
      tags:
      - Маршрути погодження
      summary: Скасувати маршрут (ініціатор або автор)
      operationId: cancel_route_api_v1_routes__route_id__cancel_post
      security:
      - HTTPBearer: []
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Route Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteCancel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteView'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Немає права на цю дію (не автор/ініціатор/учасник кроку, сервісний акаунт ШІ)
        '404':
          description: Документ, маршрут або крок не знайдено
        '409':
          description: 'Неприпустимо в поточному стані: етап ще не настав, рішення вже прийнято, посада вакантна, немає/кілька
            шаблонів, відкриті критичні зауваження'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/approval-tasks:
    get:
      tags:
      - Маршрути погодження
      summary: Мої документи на візування (активні кроки)
      operationId: inbox_api_v1_approval_tasks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InboxItem'
                type: array
                title: Response Inbox Api V1 Approval Tasks Get
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Немає права на цю дію (не автор/ініціатор/учасник кроку, сервісний акаунт ШІ)
        '404':
          description: Документ, маршрут або крок не знайдено
        '409':
          description: 'Неприпустимо в поточному стані: етап ще не настав, рішення вже прийнято, посада вакантна, немає/кілька
            шаблонів, відкриті критичні зауваження'
      security:
      - HTTPBearer: []
  /api/v1/steps/{step_id}/signing-request:
    get:
      tags:
      - Маршрути погодження
      summary: 'Що підписувати: версія документа і її SHA-256'
      operationId: signing_request_api_v1_steps__step_id__signing_request_get
      security:
      - HTTPBearer: []
      parameters:
      - name: step_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Step Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningRequestView'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Немає права на цю дію (не автор/ініціатор/учасник кроку, сервісний акаунт ШІ)
        '404':
          description: Документ, маршрут або крок не знайдено
        '409':
          description: 'Неприпустимо в поточному стані: етап ще не настав, рішення вже прийнято, посада вакантна, немає/кілька
            шаблонів, відкриті критичні зауваження'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/steps/{step_id}/sign:
    post:
      tags:
      - Маршрути погодження
      summary: Завізувати крок із КЕП; наступний етап активується лише після валідного підпису
      operationId: sign_step_api_v1_steps__step_id__sign_post
      security:
      - HTTPBearer: []
      parameters:
      - name: step_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Step Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteView'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Немає права на цю дію (не автор/ініціатор/учасник кроку, сервісний акаунт ШІ)
        '404':
          description: Документ, маршрут або крок не знайдено
        '409':
          description: 'Неприпустимо в поточному стані: етап ще не настав, рішення вже прийнято, посада вакантна, немає/кілька
            шаблонів, відкриті критичні зауваження'
        '422':
          description: Підпис КЕП не пройшов перевірку (причина в detail)
  /api/v1/steps/{step_id}/decision:
    post:
      tags:
      - Маршрути погодження
      summary: Відхилити крок (з причиною) або погодити крок, що не потребує КЕП
      operationId: decide_step_api_v1_steps__step_id__decision_post
      security:
      - HTTPBearer: []
      parameters:
      - name: step_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Step Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepDecision'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteView'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Немає права на цю дію (не автор/ініціатор/учасник кроку, сервісний акаунт ШІ)
        '404':
          description: Документ, маршрут або крок не знайдено
        '409':
          description: 'Неприпустимо в поточному стані: етап ще не настав, рішення вже прийнято, посада вакантна, немає/кілька
            шаблонів, відкриті критичні зауваження'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/kep/challenges:
    post:
      tags:
      - Ключі підпису
      summary: Отримати виклик для доказу володіння ключем КЕП
      operationId: challenge_api_v1_kep_challenges_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeView'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Не власник ключа і не адміністратор ключів
        '404':
          description: Ключ не знайдено або внутрішній ЦСК вимкнено
        '422':
          description: Підпис або сертифікат не пройшли перевірку; надіслано файл з особистим ключем
      security:
      - HTTPBearer: []
  /api/v1/kep/keys:
    post:
      tags:
      - Ключі підпису
      summary: Закріпити за собою ключ КЕП (підпис виклику; файл-ключ на сервер не передається)
      operationId: register_key_api_v1_kep_keys_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyRegisterRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyBindingView'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Не власник ключа і не адміністратор ключів
        '404':
          description: Ключ не знайдено або внутрішній ЦСК вимкнено
        '422':
          description: Підпис або сертифікат не пройшли перевірку; надіслано файл з особистим ключем
    get:
      tags:
      - Ключі підпису
      summary: Мої ключі підпису
      operationId: my_keys_api_v1_kep_keys_get
      security:
      - HTTPBearer: []
      parameters:
      - name: include_revoked
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Revoked
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyBindingView'
                title: Response My Keys Api V1 Kep Keys Get
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Не власник ключа і не адміністратор ключів
        '404':
          description: Ключ не знайдено або внутрішній ЦСК вимкнено
        '422':
          description: Підпис або сертифікат не пройшли перевірку; надіслано файл з особистим ключем
  /api/v1/kep/keys/{binding_id}/revoke:
    post:
      tags:
      - Ключі підпису
      summary: Відкріпити ключ (власник або адміністратор ключів)
      operationId: revoke_key_api_v1_kep_keys__binding_id__revoke_post
      security:
      - HTTPBearer: []
      parameters:
      - name: binding_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Binding Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyRevokeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyBindingView'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Не власник ключа і не адміністратор ключів
        '404':
          description: Ключ не знайдено або внутрішній ЦСК вимкнено
        '422':
          description: Підпис або сертифікат не пройшли перевірку; надіслано файл з особистим ключем
  /api/v1/kep/certificates/inspect:
    post:
      tags:
      - Ключі підпису
      summary: 'Перевірити сертифікат (.cer/.crt/.pem): власник, КНЕДП, строк, РНОКПП (маскований)'
      operationId: inspect_certificate_api_v1_kep_certificates_inspect_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_inspect_certificate_api_v1_kep_certificates_inspect_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateCheckView'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Не власник ключа і не адміністратор ключів
        '404':
          description: Ключ не знайдено або внутрішній ЦСК вимкнено
        '422':
          description: Підпис або сертифікат не пройшли перевірку; надіслано файл з особистим ключем
      security:
      - HTTPBearer: []
  /api/v1/kep/signatures/verify:
    post:
      tags:
      - Ключі підпису
      summary: Перевірити підпис CAdES над SHA-256 (без прийняття візи)
      operationId: verify_signature_api_v1_kep_signatures_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureVerifyView'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Не власник ключа і не адміністратор ключів
        '404':
          description: Ключ не знайдено або внутрішній ЦСК вимкнено
        '422':
          description: Підпис або сертифікат не пройшли перевірку; надіслано файл з особистим ключем
      security:
      - HTTPBearer: []
  /api/v1/kep/internal/ca.pem:
    get:
      tags:
      - Ключі підпису
      summary: Ланцюжок сертифікатів внутрішнього ЦСК АІ-СЕД ПУЕТ
      operationId: ca_chain_api_v1_kep_internal_ca_pem_get
      responses:
        '200':
          description: Successful Response
          content:
            application/x-pem-file: {}
  /api/v1/kep/internal/crl:
    get:
      tags:
      - Ключі підпису
      summary: Список відкликаних внутрішніх сертифікатів (CRL, DER)
      operationId: crl_api_v1_kep_internal_crl_get
      responses:
        '200':
          description: Successful Response
          content:
            application/pkix-crl: {}
  /api/v1/kep/internal/certificates/csr:
    post:
      tags:
      - Ключі підпису
      summary: Отримати внутрішній сертифікат за CSR (ключ згенеровано на вашому комп'ютері)
      operationId: enroll_csr_api_v1_kep_internal_certificates_csr_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsrEnrollRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalCertView'
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Не власник ключа і не адміністратор ключів
        '404':
          description: Ключ не знайдено або внутрішній ЦСК вимкнено
        '422':
          description: Підпис або сертифікат не пройшли перевірку; надіслано файл з особистим ключем
      security:
      - HTTPBearer: []
  /api/v1/kep/internal/key-file:
    post:
      tags:
      - Ключі підпису
      summary: Згенерувати внутрішній файл-ключ (PKCS#12, видається один раз)
      operationId: key_file_api_v1_kep_internal_key_file_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyFileRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/x-pkcs12: {}
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Не власник ключа і не адміністратор ключів
        '404':
          description: Ключ не знайдено або внутрішній ЦСК вимкнено
        '422':
          description: Підпис або сертифікат не пройшли перевірку; надіслано файл з особистим ключем
      security:
      - HTTPBearer: []
  /api/v1/kep/internal/certificates/{serial}/revoke:
    post:
      tags:
      - Ключі підпису
      summary: Відкликати внутрішній сертифікат (власник або адміністратор ключів)
      operationId: revoke_internal_api_v1_kep_internal_certificates__serial__revoke_post
      security:
      - HTTPBearer: []
      parameters:
      - name: serial
        in: path
        required: true
        schema:
          type: string
          title: Serial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyRevokeRequest'
      responses:
        '204':
          description: Successful Response
        '401':
          description: Немає або недійсний токен Keycloak
        '403':
          description: Не власник ключа і не адміністратор ключів
        '404':
          description: Ключ не знайдено або внутрішній ЦСК вимкнено
        '422':
          description: Підпис або сертифікат не пройшли перевірку; надіслано файл з особистим ключем
  /api/v1/dev/steps/{step_id}/mock-signature:
    post:
      tags:
      - Імітація КЕП (лише development/test)
      summary: Згенерувати імітаційний КЕП поточного користувача для кроку
      operationId: mock_signature_api_v1_dev_steps__step_id__mock_signature_post
      security:
      - HTTPBearer: []
      parameters:
      - name: step_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Step Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockSignature'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
