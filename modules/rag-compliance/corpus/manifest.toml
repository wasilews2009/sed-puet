# Нормативний корпус для RAG-аудиту СЕД ПУЕТ.
#
#   python -m sed_rag.ingestion.cli ingest-manifest corpus/manifest.toml
#
# file — шлях відносно цього файлу (.pdf, .txt, .md). PDF-скани розпізнаються Tesseract ukr+eng.
# text_quality — 1.0 для офіційного/вичитаного тексту; для OCR — середня впевненість розпізнавання
#   (у звіті цитати з таких актів позначаються «звірте з оригіналом» і мають нижчий confidence).
# is_sample = true — демонстраційний текст, НЕ офіційна редакція (у звіті є попередження).
#
# Акти ПУЕТ нижче — OCR-текст сканів із папки проєкту (corpus/ocr/*.ocr.txt, не вичитаний).
# Рекомендовано: вичитати текст, покласти поруч як *.txt і змінити file + text_quality = 1.0.
# Дати набрання чинності взято з титульних сторінок; звірте з оригіналами.

